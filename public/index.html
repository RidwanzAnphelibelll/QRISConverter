<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Konversi QRIS statis menjadi QRIS dinamis dengan nominal custom.">
  <title>QRIS Converter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c6af7'/><rect x='6' y='6' width='8' height='8' rx='1' fill='white'/><rect x='18' y='6' width='8' height='8' rx='1' fill='white'/><rect x='6' y='18' width='8' height='8' rx='1' fill='white'/><rect x='18' y='18' width='4' height='4' rx='0.5' fill='white'/><rect x='24' y='18' width='2' height='2' fill='white'/><rect x='22' y='22' width='4' height='4' rx='0.5' fill='white'/><rect x='18' y='24' width='2' height='2' fill='white'/></svg>" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: #2a2a3a;
      --accent: #7c6af7;
      --accent2: #5eead4;
      --text: #f0f0f8;
      --muted: #6b6b88;
      --success: #4ade80;
      --danger: #f87171;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(124,106,247,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(94,234,212,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto;
    }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .logo-text span { color: var(--accent); }
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
    .card-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title { font-size: 15px; font-weight: 700; }
    .badge {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(124,106,247,0.15);
      color: var(--accent);
      border: 1px solid rgba(124,106,247,0.3);
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .card-body { padding: 20px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
      min-height: 90px;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }
    input[type="number"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input[type="number"]:focus { border-color: var(--accent); }
    input[type="number"]::placeholder { color: var(--muted); }
    .upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface2);
      position: relative;
    }
    .upload-label:hover { border-color: var(--accent); background: rgba(124,106,247,0.07); }
    .upload-label.has-file { border-color: var(--accent2); }
    #scan-file-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .drop-icon {
      width: 44px;
      height: 44px;
      background: rgba(124,106,247,0.12);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--accent);
    }
    .upload-label p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .upload-label small {
      font-size: 11px;
      color: var(--muted);
      opacity: 0.7;
    }
    .file-chosen {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent2);
      word-break: break-all;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #6a59e8; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-success { background: var(--success); color: #0a0a0f; }
    .btn-success:hover { background: #36c96a; }
    .btn-success:active { transform: scale(0.98); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      margin-top: 10px;
      font-size: 12px;
    }
    .btn-ghost:hover { border-color: var(--accent2); color: var(--accent2); }
    .btn-ghost:active { transform: scale(0.98); }
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .qr-frame {
      position: relative;
      padding: 10px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 0 0 1px var(--border), 0 16px 48px rgba(0,0,0,0.4);
    }
    .qr-frame img {
      display: block;
      width: min(200px, 55vw);
      height: min(200px, 55vw);
      border-radius: 6px;
    }
    .amount-box {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      text-align: center;
    }
    .amount-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .amount-value {
      font-family: 'DM Mono', monospace;
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 500;
      color: var(--accent2);
      letter-spacing: -0.02em;
    }
    .result-string-box {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .result-string-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .result-string-val {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text);
      word-break: break-all;
      line-height: 1.6;
    }
    .btn-row {
      width: 100%;
      display: flex;
      gap: 8px;
    }
    .btn-row .btn { flex: 1; font-size: 12px; padding: 11px 8px; }
    .btn-copy {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-copy:hover { border-color: var(--accent2); color: var(--accent2); }
    .btn-copy.copied { border-color: var(--success); color: var(--success); }
    .btn-copy:active { transform: scale(0.98); }
    .error-msg {
      font-size: 12px;
      color: var(--danger);
      margin-top: 7px;
      display: none;
      padding: 8px 12px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
    }
    .decode-result-box {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    .decode-result-box.show { display: flex; }
    .decode-preview { display: flex; justify-content: center; }
    .decode-preview img {
      max-width: 140px;
      max-height: 140px;
      border-radius: 8px;
      border: 1px solid var(--border);
      object-fit: contain;
      background: #fff;
      padding: 4px;
    }
    footer {
      position: relative;
      z-index: 1;
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { color: var(--accent2); }
    @media (max-width: 380px) {
      .card-body { padding: 14px; }
      .qr-section { gap: 12px; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-text">QRIS <span>CONVERTER</span></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title" id="card-title">Konversi QRIS</div>
        <div class="badge" id="header-badge">STATIS → DINAMIS</div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-convert" onclick="switchTab('convert')">Konversi</button>
        <button class="tab-btn" id="tab-scan" onclick="switchTab('scan')">Scan QR</button>
      </div>

      <div class="card-body">

        <div class="screen active" id="screen-form">
          <div class="form-group">
            <label>QRIS String Statis</label>
            <textarea id="qris-input" placeholder="Paste string QRIS statis di sini..."></textarea>
          </div>
          <div class="form-group">
            <label>Nominal (Rp)</label>
            <input type="number" id="amount" placeholder="Minimal 1" min="1" />
            <div class="error-msg" id="form-error"></div>
          </div>
          <button class="btn btn-primary" id="btn-convert" onclick="convertQris()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            Konversi & Tampilkan
          </button>
        </div>

        <div class="screen" id="screen-result">
          <div class="qr-section">
            <div class="qr-frame">
              <img id="qr-img" src="" alt="QR Code" />
            </div>
            <div class="amount-box">
              <div class="amount-label">Nominal</div>
              <div class="amount-value" id="display-amount">Rp 0</div>
            </div>
            <div class="result-string-box">
              <div class="result-string-label">QR URL</div>
              <div class="result-string-val" id="display-qr-url">-</div>
            </div>
            <div class="btn-row">
              <button class="btn btn-copy" id="btn-copy" onclick="copyQris()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Salin URL
              </button>
              <button class="btn btn-success" id="btn-download" onclick="downloadQris()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Unduh QR
              </button>
            </div>
            <button class="btn btn-ghost" onclick="resetForm()">← Konversi Lagi</button>
          </div>
        </div>

        <div class="screen" id="screen-scan">
          <div class="form-group">
            <label>Upload Gambar QRIS</label>
            <label class="upload-label" id="upload-label">
              <input type="file" id="scan-file-input" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
              <div class="drop-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              </div>
              <p>Klik untuk memilih gambar</p>
              <small>Mendukung JPG, JPEG, PNG, WEBP</small>
              <div class="file-chosen" id="scan-file-chosen"></div>
            </label>
            <div class="error-msg" id="scan-error"></div>
          </div>

          <button class="btn btn-primary" id="btn-scan" onclick="scanQris()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="3" height="3"/><rect x="14" y="7" width="3" height="3"/><rect x="7" y="14" width="3" height="3"/><rect x="14" y="14" width="3" height="3"/></svg>
            Scan & Decode
          </button>

          <div class="decode-result-box" id="decode-result-box">
            <div class="decode-preview">
              <img id="decode-preview-img" src="" alt="Preview" />
            </div>
            <div class="result-string-box" style="margin:0">
              <div class="result-string-label">QRIS String Hasil Scan</div>
              <div class="result-string-val" id="decode-qris-string">-</div>
            </div>
            <button class="btn-copy" id="btn-copy-decode" onclick="copyDecoded()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Salin String
            </button>
            <button class="btn btn-ghost" style="margin-top:4px" onclick="pasteToConvert()">
              Pakai untuk Konversi →
            </button>
          </div>
        </div>

      </div>
    </div>

    <footer>
      <p>Powered by <a href="https://github.com/Ridwanzanphelibelll/QRISConverter" target="_blank">RSCoders</a> &copy; <span id="yr"></span></p>
    </footer>
  </div>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    var currentQrisString = '';
    var currentAmount = 0;
    var decodedQrisString = '';

    var ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
    var ALLOWED_EXT = ['.jpg', '.jpeg', '.png', '.webp'];

    function fmt(n) {
      return 'Rp ' + parseInt(n).toLocaleString('id-ID');
    }

    function copyText(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById('screen-' + id).classList.add('active');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.getElementById('tab-' + tab).classList.add('active');
      if (tab === 'convert') {
        document.getElementById('header-badge').textContent = 'STATIS → DINAMIS';
        document.getElementById('card-title').textContent = 'Konversi QRIS';
        showScreen('form');
      } else {
        document.getElementById('header-badge').textContent = 'GAMBAR → STRING';
        document.getElementById('card-title').textContent = 'Scan QRIS';
        showScreen('scan');
      }
    }

    function isAllowedFile(file) {
      if (!file) return false;
      var ext = '.' + file.name.split('.').pop().toLowerCase();
      return ALLOWED_TYPES.includes(file.type) || ALLOWED_EXT.includes(ext);
    }

    async function convertQris() {
      var qrisInput = document.getElementById('qris-input').value.trim();
      var amount = document.getElementById('amount').value;
      var errEl = document.getElementById('form-error');
      var btn = document.getElementById('btn-convert');
      errEl.style.display = 'none';
      if (!qrisInput || !amount || parseInt(amount) < 1) {
        errEl.textContent = 'Isi semua field dengan benar.';
        errEl.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Memproses...';
      try {
        var res = await fetch('/api/qris/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: parseInt(amount), static_qr: qrisInput }),
        });
        var data = await res.json();
        if (!data.success) throw new Error(data.message || 'Gagal generate QRIS.');
        currentQrisString = data.qris_string;
        currentAmount = data.amount;
        document.getElementById('display-amount').textContent = fmt(data.amount);
        document.getElementById('display-qr-url').textContent = data.qr_url;
        document.getElementById('qr-img').src = data.qr_url;
        document.getElementById('card-title').textContent = 'Hasil Konversi';
        showScreen('result');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> Konversi & Tampilkan';
      }
    }

    function copyQris() {
      var btn = document.getElementById('btn-copy');
      copyText(document.getElementById('display-qr-url').textContent);
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Tersalin!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Salin URL';
        btn.classList.remove('copied');
      }, 2000);
    }

    async function downloadQris() {
      var url = document.getElementById('qr-img').src;
      try {
        var r = await fetch(url);
        var blob = await r.blob();
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'qris-' + currentAmount + '.png';
        a.click();
        URL.revokeObjectURL(a.href);
      } catch(e) {
        window.open(url, '_blank');
      }
    }

    function resetForm() {
      document.getElementById('qris-input').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('form-error').style.display = 'none';
      document.getElementById('qr-img').src = '';
      document.getElementById('display-qr-url').textContent = '-';
      var copyBtn = document.getElementById('btn-copy');
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Salin URL';
      currentQrisString = '';
      currentAmount = 0;
      document.getElementById('card-title').textContent = 'Konversi QRIS';
      showScreen('form');
    }

    document.getElementById('scan-file-input').addEventListener('change', function() {
      var file = this.files[0];
      var label = document.getElementById('upload-label');
      var errEl = document.getElementById('scan-error');
      errEl.style.display = 'none';
      if (file && !isAllowedFile(file)) {
        errEl.textContent = 'Format tidak didukung! Gunakan JPG, JPEG, PNG, atau WEBP.';
        errEl.style.display = 'block';
        this.value = '';
        document.getElementById('scan-file-chosen').textContent = '';
        label.classList.remove('has-file');
        return;
      }
      document.getElementById('scan-file-chosen').textContent = file ? file.name : '';
      if (file) { label.classList.add('has-file'); } else { label.classList.remove('has-file'); }
    });

    async function scanQris() {
      var fileInput = document.getElementById('scan-file-input');
      var file = fileInput.files[0];
      var errEl = document.getElementById('scan-error');
      errEl.style.display = 'none';
      document.getElementById('decode-result-box').classList.remove('show');

      if (!file) {
        errEl.textContent = 'Pilih gambar QRIS terlebih dahulu!';
        errEl.style.display = 'block';
        return;
      }
      if (!isAllowedFile(file)) {
        errEl.textContent = 'Format tidak didukung! Gunakan JPG, JPEG, PNG, atau WEBP.';
        errEl.style.display = 'block';
        return;
      }

      var btn = document.getElementById('btn-scan');
      btn.disabled = true;
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Memproses...';

      try {
        var fd = new FormData();
        fd.append('file', file);
        var res = await fetch('/api/qris/decode', { method: 'POST', body: fd });
        var json = await res.json();
        if (!json.success) throw new Error(json.message);
        decodedQrisString = json.qris_string;

        var reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('decode-preview-img').src = e.target.result;
        };
        reader.readAsDataURL(file);

        document.getElementById('decode-qris-string').textContent = decodedQrisString;
        document.getElementById('decode-result-box').classList.add('show');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="3" height="3"/><rect x="14" y="7" width="3" height="3"/><rect x="7" y="14" width="3" height="3"/><rect x="14" y="14" width="3" height="3"/></svg> Scan & Decode';
      }
    }

    function copyDecoded() {
      var btn = document.getElementById('btn-copy-decode');
      copyText(decodedQrisString);
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Tersalin!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Salin String';
        btn.classList.remove('copied');
      }, 2000);
    }

    function pasteToConvert() {
      document.getElementById('qris-input').value = decodedQrisString;
      switchTab('convert');
    }

    document.getElementById('qris-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); convertQris(); }
    });
  </script>
</body>
</html>
